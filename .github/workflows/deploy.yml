name: Deploy web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          API_BASE_URL: http://127.0.0.1:9/api/v1
          CHECKOUT_ENABLED: 'false'
      - name: Package standalone release
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          tar --dereference --hard-dereference --exclude='./.next/cache' -czf "$RUNNER_TEMP/web.tgz" -C .next/standalone .
      - name: Deploy and verify (server rolls back on failure)
        env:
          DEPLOY_KEY: ${{ secrets.WEB_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.WEB_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.WEB_DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.WEB_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_HOST:?WEB_DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?WEB_DEPLOY_USER is required}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/web
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/web ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/web' EXIT
          ssh -i ~/.ssh/web -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/web.tgz"
